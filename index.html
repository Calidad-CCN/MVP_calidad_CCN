<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#0066CC;--sec:#003366;--red:#FF3333;--bg:#F5F7FB;--sur:#fff;--txt:#1E293B;--mut:#64748B;--bor:#E2E8F0;--ok:#10B981;--warn:#F59E0B;--dan:#EF4444;--r:12px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Carlito',Calibri,'Segoe UI',Arial,sans-serif;font-size:15px;color:var(--txt);background:var(--bg);line-height:1.45}
h1,h2,h3,h4{font-family:'DM Sans','Segoe UI',Arial,sans-serif;color:var(--sec);margin:0 0 .5rem}h1{font-size:1.45rem}h2{font-size:1.15rem}h3{font-size:1rem}
a{color:var(--pri)}button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:.45rem .9rem;cursor:pointer;text-decoration:none;font-weight:700;font-size:.9rem}
.btn.sec{background:#fff;color:var(--pri)}.btn.gh{background:transparent;border-color:var(--bor);color:var(--txt);font-weight:400}.btn.sm{padding:.22rem .6rem;font-size:.82rem}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--bor);border-radius:8px;background:#fff;color:var(--txt)}
label{display:block;font-weight:700;font-size:.82rem;margin:.55rem 0 .2rem;color:var(--mut)}
.card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:1.1rem;box-shadow:0 2px 8px rgba(0,51,102,.05)}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut)}.sm{font-size:.85rem}.mt{margin-top:1rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:#F1F5F9;color:var(--sec);text-align:left;font-family:'DM Sans',Arial,sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em}
th,td{padding:.5rem .6rem;border-bottom:1px solid var(--bor);vertical-align:middle}tr.ck{cursor:pointer}tr.ck:hover td{background:#F8FBFF}
.b{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
.ok{background:#D1FAE5;color:#065F46}.wa{background:#FEF3C7;color:#92400E}.da{background:#FEE2E2;color:#991B1B}.in{background:#DBEAFE;color:#1E40AF}.ne{background:#F1F5F9;color:#475569}
.bar{height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden;min-width:80px}.bar>span{display:block;height:100%}
.kpi{font-family:'DM Sans',Arial,sans-serif;font-size:1.7rem;font-weight:700;color:var(--sec)}
/* Estructura: barra lateral + contenido */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--sec);color:#fff;padding:1rem .8rem;position:sticky;top:0;height:100vh;overflow-y:auto}
.side img{height:34px;margin:.2rem .4rem 1rem}
.side a{display:flex;align-items:center;gap:.5rem;color:#DCE7F5;text-decoration:none;padding:.48rem .6rem;border-radius:8px;font-size:.92rem}
.side a:hover{background:rgba(255,255,255,.08);color:#fff}.side a.on{background:#fff;color:var(--sec);font-weight:700}
.side .gr{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#8FB0D6;margin:1rem .6rem .3rem}
.side .num{display:inline-flex;width:1.35rem;height:1.35rem;border-radius:6px;background:rgba(255,255,255,.14);align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.side a.on .num{background:var(--pri);color:#fff}
.cnt{display:inline-flex;min-width:1.3rem;height:1.3rem;padding:0 .35rem;border-radius:999px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;align-items:center;justify-content:center;margin-left:auto}
.top{display:flex;align-items:center;gap:1rem;padding:.7rem 1.4rem;background:#fff;border-bottom:1px solid var(--bor);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top select{width:auto;min-width:240px}.user{font-size:.88rem;color:var(--mut)}
main{padding:1.3rem 1.4rem 3rem;max-width:1280px}
.crumb{font-size:.82rem;color:var(--mut);margin-bottom:.4rem}
.tabs{display:flex;gap:.25rem;border-bottom:2px solid var(--bor);margin:0 0 1rem;flex-wrap:wrap}
.tabs a{padding:.5rem .85rem;text-decoration:none;color:var(--mut);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;font-size:.92rem}.tabs a.on{color:var(--pri);border-color:var(--pri)}
.seg{display:inline-flex;border:1px solid var(--bor);border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;padding:.3rem .65rem;cursor:pointer;border-right:1px solid var(--bor);font-size:.85rem}.seg button:last-child{border-right:0}
.seg .c{background:#D1FAE5;color:#065F46;font-weight:700}.seg .n{background:#FEE2E2;color:#991B1B;font-weight:700}.seg .a{background:#E2E8F0;font-weight:700}
.chip{display:inline-block;padding:.4rem .75rem;border-radius:8px;color:#fff;font-weight:700;margin:.18rem;font-size:.88rem}.cok{background:#16A34A}.cno{background:#DC2626}.csn{background:#94A3B8}
.tarea{display:flex;gap:.8rem;align-items:center;padding:.6rem .3rem;border-bottom:1px solid var(--bor);text-decoration:none;color:inherit}.tarea:hover{background:#F8FBFF}
.tarea .md{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.pasos{display:flex;list-style:none;padding:0;margin:.5rem 0;counter-reset:p;flex-wrap:wrap}
.pasos li{flex:1;min-width:120px;position:relative;padding:.35rem .5rem .35rem 1.9rem;font-size:.82rem;color:var(--mut);border-top:3px solid var(--bor)}
.pasos li::before{counter-increment:p;content:counter(p);position:absolute;left:.3rem;top:.35rem;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--bor);color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.pasos li.h{border-color:var(--ok);color:var(--txt)}.pasos li.h::before{background:var(--ok);content:'✓'}.pasos li.x{border-color:var(--pri);color:var(--pri);font-weight:700}.pasos li.x::before{background:var(--pri)}
.mod{display:block;text-decoration:none;color:inherit;border-left:4px solid var(--pri);transition:transform .15s}.mod:hover{transform:translateY(-2px)}
.mod .t{font-family:'DM Sans',Arial,sans-serif;font-weight:700;color:var(--sec)}
.nota{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E3A8A;border-radius:8px;padding:.55rem .8rem;font-size:.85rem;margin:.6rem 0}
.aviso{background:#FEF3C7;border:1px solid #FDE68A;color:#78350F;border-radius:8px;padding:.55rem .8rem;font-size:.85rem;margin:.6rem 0}
.gauge{text-align:center}.gauge h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;min-height:2.3em}.gauge svg{width:100%;max-width:210px}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:linear-gradient(160deg,#F5F7FB,#DCE7F5)}
.auth .card{width:100%;max-width:410px;padding:2rem}.auth img{width:150px;display:block;margin:0 auto 1rem}
.big{font-family:'DM Sans',Arial,sans-serif;font-size:2rem;font-weight:700}
.mes{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:.5rem}.mes>div{border:1px solid var(--bor);border-radius:8px;padding:.45rem;text-align:center;font-size:.82rem}
.drop{border:2px dashed #93C5FD;border-radius:var(--r);padding:1.2rem;text-align:center;background:#F8FBFF}
.cert{border:2px solid var(--sec);border-radius:var(--r);padding:1.2rem;background:#fff}
.mono{font-family:Consolas,monospace;font-size:.8rem;word-break:break-all}
.menu-btn{display:none}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-105%);transition:transform .2s}.side.abierta{transform:none}.menu-btn{display:inline-flex}}
@media print{.side,.top{display:none}.app{display:block}}
</style>
</head>

  <div class="card"><h3>De SerQ no se traspasa (sin datos en uso)</h3><ul><li>Informes de indicadores agrupados y planes de trabajo anuales (solo una configuración de 2021).</li><li>Catálogos de configuración de eventos adversos (clasificación, ámbitos, medidas preventivas): estaban vacíos; se usan listas fijas.</li><li>Códigos QR de documentos y carga de logo.</li><li>Áreas temáticas como catálogo aparte: se usa "Dirección" y se agregan desde Administración si se necesitan.</li></ul></div>
  <div class="card"><h3>Mejoras de uso respecto a SerQ</h3><ul><li>Una bandeja de tareas en vez de revisar módulo por módulo.</li><li>Selector de sucursal o red completa en un clic.</li><li>Pautas en una sola pantalla con % en vivo, en lugar de selectores encadenados.</li><li>Indicadores automáticos desde pautas y contraloría, sin doble digitación.</li><li>El botón Atrás no pierde lo escrito.</li></ul></div>
  <div class="card"><h3>Para el prototipo formal</h3><ul><li>Inicio de sesión con credenciales institucionales y permisos por rol en el servidor.</li><li>Base de datos con RUT/N° SAM anonimizado; visible solo en la revisión activa.</li><li>Archivos (PDF, actas, evidencias) almacenados de forma segura.</li><li>Exportación a PDF y Excel.</li></ul></div></div>`;

/* ---------- Marco, navegación y eventos ---------- */
const NAV = [['inicio','Inicio',''],['tareas','Mis tareas','',true],['g','Módulos'],['acreditacion','Acreditación','1'],['seremi','Visita SEREMI','2'],['gcl','Gestión de calidad','3'],['documental','Gestión documental','4'],['paciente','Atención al paciente','5'],['contraloria','Contraloría y muestreo','6'],['g','Cuenta'],['acciones','Mis acciones',''],['admin','Administración',''],['acerca','Acerca de la maqueta','']];
function render(){
  const [sec = 'inicio', ...resto] = location.hash.replace(/^#\/?/, '').split('/');
  const app = document.getElementById('app');
  if (!S.user && sec !== 'login'){ location.hash = '#/login'; return; }
  if (sec === 'login'){ app.innerHTML = V.login(); document.getElementById('entrar').onclick = () => { S.user = document.getElementById('lu').value || 'Usuario demo'; guardar(); location.hash = '#/inicio'; }; return; }
  const n = tareas().filter(t => t.n < 2).length;
  app.innerHTML = `<div class="app"><nav class="side" id="side"><img src="${LOGO_BLANCO_H}" alt="Clínica Cruz Nacional">${NAV.map(([k, t, num, cnt]) => k === 'g' ? `<div class="gr">${t}</div>` : `<a href="#/${k}" class="${k === sec ? 'on' : ''}">${num ? `<span class="num">${num}</span>` : ''}${t}${cnt && n ? `<span class="cnt">${n}</span>` : ''}</a>`).join('')}</nav>
    <div><div class="top"><button class="btn gh sm menu-btn" id="menu">☰ Menú</button><select id="suc"><option value="RED">Consolidado red (todas las sucursales)</option>${SUCURSALES.map(([c, nm]) => `<option value="${c}" ${S.suc === c ? 'selected' : ''}>${c} ${nm}</option>`).join('')}</select>
      <span class="sp"></span><span class="user">${esc(S.user)} · Gestión Clínica y Calidad</span><button class="btn sm gh" id="salir">Salir</button></div>
    <main>${(V[sec] || V.inicio)(resto)}</main></div></div>`;
  document.getElementById('suc').value = S.suc;
  document.getElementById('suc').onchange = e => { S.suc = e.target.value; guardar(); render(); };
  document.getElementById('salir').onclick = () => { delete S.user; guardar(); location.hash = '#/login'; };
  document.getElementById('menu').onclick = () => document.getElementById('side').classList.toggle('abierta');
  document.querySelectorAll('[data-ev] button').forEach(b => b.onclick = () => { S.eval[b.parentElement.dataset.ev] = b.dataset.v; guardar(); render(); });
  document.querySelectorAll('[data-ciclo]').forEach(b => b.onclick = () => { S.eval[b.dataset.ciclo] = {c:'n', n:'a', a:'c'}[b.dataset.v]; guardar(); const y = scrollY; render(); scrollTo(0, y); });
  document.querySelectorAll('[data-fea]').forEach(b => b.onclick = () => { S.filtroEA = b.dataset.fea; guardar(); render(); });
  ['perA','perB'].forEach(id => { const el = document.getElementById(id); if (el) el.onchange = () => { S[id] = el.value; guardar(); const y = scrollY; render(); scrollTo(0, y); }; });
  document.querySelectorAll('[data-pc] button').forEach(b => b.onclick = () => { const [id, i] = b.parentElement.dataset.pc.split('|'); S.pauta[id][i] = b.dataset.v; guardar(); render(); });
  document.getElementById('guardarPauta')?.addEventListener('click', () => { delete S.pauta[resto[1]]; guardar(); location.hash = '#/gcl/pautas'; });
  document.getElementById('verRut')?.addEventListener('click', e => { document.getElementById('rut').textContent = '12.345.678-9 (ficticio)'; e.target.remove(); });
  const calc = () => { const N = +document.getElementById('mN').value, z = +document.getElementById('mZ').value, e = +document.getElementById('mE').value, p = +document.getElementById('mP').value;
    const n0 = z * z * p * (1 - p) / (e * e), n = N > 0 ? Math.ceil(n0 / (1 + (n0 - 1) / N)) : Math.ceil(n0); document.getElementById('mRes').textContent = isFinite(n) && n > 0 ? n + ' fichas' : '—'; return n; };
  if (document.getElementById('mN')){ ['mN','mZ','mE','mP'].forEach(id => document.getElementById(id).oninput = calc); calc();
    document.getElementById('mAle').onclick = () => { const n = calc(), N = +document.getElementById('mN').value, r = rng('semilla' + Date.now()), set = new Set(); while (set.size < Math.min(n, N)) set.add(1 + Math.floor(r() * N)); document.getElementById('mLista').textContent = 'Fichas: ' + [...set].sort((a, b) => a - b).join(', '); }; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>

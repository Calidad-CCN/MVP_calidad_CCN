<style>
:root{
  --cn-primary:#0066CC; --cn-secondary:#003366; --cn-red:#FF3333;
  --bg:#F7F9FC; --surface:#FFFFFF; --text:#1E293B; --muted:#64748B; --border:#E2E8F0;
  --ok:#10B981; --warn:#F59E0B; --danger:#EF4444;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Carlito',Calibri,'Segoe UI',Arial,sans-serif;font-size:15px;color:var(--text);background:var(--bg);line-height:1.45}
h1,h2,h3,h4{font-family:'DM Sans','Segoe UI',Arial,sans-serif;color:var(--cn-secondary);margin:0 0 .5rem}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}h4{font-size:.95rem}
a{color:var(--cn-primary)}
button,select,input,textarea{font-family:inherit;font-size:.95rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--cn-primary);background:var(--cn-primary);color:#fff;border-radius:8px;padding:.45rem .9rem;cursor:pointer;text-decoration:none;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--cn-primary)}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--text);font-weight:400}
.btn.sm{padding:.25rem .6rem;font-size:.85rem}
.btn.danger{background:var(--danger);border-color:var(--danger)}
input,select,textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:700;font-size:.85rem;margin:.6rem 0 .25rem;color:var(--muted)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;box-shadow:0 2px 8px rgba(0,51,102,.05)}
.muted{color:var(--muted)}.small{font-size:.85rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:#F1F5F9;color:var(--cn-secondary);text-align:left;font-family:'DM Sans',Arial,sans-serif;font-size:.8rem;text-transform:uppercase;letter-spacing:.02em}
th,td{padding:.55rem .6rem;border-bottom:1px solid var(--border);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#F8FBFF}
.badge{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.b-ok{background:#D1FAE5;color:#065F46}.b-warn{background:#FEF3C7;color:#92400E}.b-danger{background:#FEE2E2;color:#991B1B}.b-info{background:#DBEAFE;color:#1E40AF}.b-neutral{background:#F1F5F9;color:#475569}
.bar{height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%}
/* Topbar */
.topbar{background:var(--cn-secondary);color:#fff;padding:.6rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar img{height:36px;display:block}
.topbar .app{font-family:'DM Sans',Arial,sans-serif;font-size:.9rem;opacity:.85;border-left:1px solid rgba(255,255,255,.3);padding-left:1rem}
.topbar select{width:auto;min-width:230px;background:#fff}
.usermenu{position:relative}
.usermenu>button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:.35rem .8rem;cursor:pointer}
.usermenu .menu{display:none;position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--border);border-radius:8px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.usermenu.open .menu{display:block}
.usermenu .menu a{display:block;padding:.6rem .9rem;color:var(--text);text-decoration:none}
.usermenu .menu a:hover{background:#F1F5F9}
.banner{background:#FEF3C7;color:#78350F;padding:.45rem 1.2rem;font-size:.85rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
main{max-width:1280px;margin:0 auto;padding:1.4rem 1.2rem 3rem}
.crumbs{font-size:.85rem;margin-bottom:.8rem}.crumbs a{text-decoration:none}
/* Módulos */
.mod{display:block;text-decoration:none;color:inherit;border-left:4px solid var(--cn-primary);transition:transform .15s}
.mod:hover{transform:translateY(-2px)}
.mod .n{font-family:'DM Sans',Arial,sans-serif;font-weight:700;color:var(--cn-secondary)}
/* Tabs */
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--border);margin-bottom:1rem;flex-wrap:wrap}
.tabs a{padding:.55rem .9rem;text-decoration:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--cn-primary);border-color:var(--cn-primary)}
/* Velocímetros */
.gauge-card{text-align:center}
.gauge-card h4{text-transform:uppercase;font-size:.82rem;letter-spacing:.03em;min-height:2.3em}
.gauge-card svg{width:100%;max-width:230px;height:auto}
/* Login */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:linear-gradient(160deg,#F7F9FC 0%,#E6EEF8 100%)}
.auth .card{width:100%;max-width:420px;padding:2rem}
.auth img{width:150px;display:block;margin:0 auto 1rem}
.notice{background:#FEF3C7;border:1px solid #FDE68A;color:#78350F;border-radius:8px;padding:.6rem .8rem;font-size:.85rem;margin:.8rem 0}
.err{color:var(--danger);font-size:.85rem;margin-top:.4rem}
.kpi{font-family:'DM Sans',Arial,sans-serif;font-size:1.6rem;font-weight:700;color:var(--cn-secondary)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:.35rem .7rem;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on-c{background:#D1FAE5;color:#065F46;font-weight:700}
.seg button.on-n{background:#FEE2E2;color:#991B1B;font-weight:700}
.seg button.on-a{background:#E2E8F0;color:#334155;font-weight:700}
.cert{border:2px solid var(--cn-secondary);border-radius:var(--radius);padding:1.4rem;background:#fff;position:relative}
.cert .marca{position:absolute;top:1rem;right:1rem}
.mono{font-family:Consolas,'Courier New',monospace;font-size:.82rem;word-break:break-all}
.dropzone{border:2px dashed #93C5FD;border-radius:var(--radius);padding:1rem;text-align:center;background:#F8FBFF}
/* Visor de solo lectura con marca de agua */
.visor{position:relative;border:1px solid var(--border);border-radius:var(--radius);background:#E9EEF4;padding:1.2rem;max-height:70vh;overflow:auto;user-select:none;-webkit-user-select:none}
.visor-pagina{background:#fff;max-width:760px;margin:0 auto;padding:2rem;box-shadow:0 2px 10px rgba(0,0,0,.08);min-height:600px}
.visor-marca{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:3rem 4rem;padding:2rem;transform:rotate(-24deg) scale(1.4);opacity:.13;z-index:2;font-size:.85rem;color:#003366;font-weight:700}
@media print{.visor,.visor *{display:none!important}}
/* Barra superior: íconos y panel de módulos */
.topbar .icono{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;text-decoration:none}
.topbar .icono:hover{background:rgba(255,255,255,.12)}
.panel-fondo{display:none;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.panel-fondo.abierto{display:block}
.panel{position:fixed;top:0;left:0;bottom:0;width:320px;max-width:85vw;background:#fff;z-index:50;padding:1.1rem;box-shadow:4px 0 24px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto}
.panel.abierto{transform:translateX(0)}
.panel>a{display:block;padding:.6rem .5rem;border-radius:8px;color:var(--text);text-decoration:none;font-weight:700}
.panel>a:hover{background:#F1F5F9;color:var(--cn-primary)}
.panel-sep{border-top:1px solid var(--border);margin:.5rem 0}
.panel-buscar{background:#F8FBFF;border:1px solid var(--border);border-radius:8px;padding:.6rem;margin:.8rem 0}
/* Línea de título con filtros al extremo derecho */
.linea-titulo{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.linea-titulo>div:first-child{flex:1;min-width:260px}
.filtros-superiores{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-left:auto}
.periodo label{margin:0}.periodo input{width:auto}
/* Módulo de acreditación */
.oculto{display:none}
.grid-meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.7rem}
.mes-card{border:1px solid var(--border);border-radius:8px;padding:.6rem;background:#FCFDFE}
.mes-card.bloqueado{background:#F1F5F9}
.mes-titulo{font-family:'DM Sans',Arial,sans-serif;font-weight:700;color:var(--cn-secondary);text-align:center;background:#E6EEF8;border-radius:6px;padding:.2rem;margin-bottom:.3rem}
.mes-card label{margin:.3rem 0 .1rem}
.chip{display:inline-block;padding:.45rem .8rem;border-radius:8px;color:#fff;font-weight:700;text-decoration:none;margin:.2rem}
.chip-ok{background:#16A34A}.chip-no{background:#DC2626}.chip-sin{background:#94A3B8}
/* Capacitaciones UCN */
.cap-card{border-left-color:var(--cn-red)}
.cap-codigo{font-family:'DM Sans',Arial,sans-serif;font-size:1.3rem;color:var(--cn-primary);font-weight:700}
.cap-portada{background:linear-gradient(135deg,#003366 0%,#0066CC 100%);color:#fff}
.cap-portada-codigo{font-family:'DM Sans',Arial,sans-serif;font-size:2.4rem;margin-top:2rem}
.cap-portada-titulo{font-family:'DM Sans',Arial,sans-serif;font-size:1.5rem}
.cap-portada-linea{width:70px;height:4px;background:var(--cn-red);margin:1rem 0}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:1rem}
@media print{.topbar,.banner,.noprint{display:none!important}main{padding:0}}
</style>
</head>

<footer class="noprint">Maqueta de demostración — todos los datos son ficticios. No ingresar datos reales de pacientes.</footer>

/* =========================================================
   Utilidades
   ========================================================= */
const esc = (valor) => String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (num, den) => den ? Math.round((num / den) * 1000) / 10 : 0;
const fmtPct = (v) => v.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
const pad = (n, l) => String(n).padStart(l, '0');
const isoHoy = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; };
const fmtFecha = (iso) => { if (!iso) return '—'; const [a,m,d] = iso.split('-'); return `${d}/${m}/${a}`; };

function semillaDesdeTexto(texto){ let h = 2166136261; for (const c of texto){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(semilla){ return function(){ semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0; let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function esDiaHabil(iso){
  const d = new Date(iso + 'T12:00:00');
  const dia = d.getDay();
  if (dia === 0 || dia === 6) return false;
  return !S.feriados.some(f => f.fecha === iso);
}
function sumarDiasHabiles(isoInicio, dias){
  const d = new Date(isoInicio + 'T12:00:00');
  let contados = 0;
  while (contados < dias){
    d.setDate(d.getDate() + 1);
    const iso = `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
    if (esDiaHabil(iso)) contados++;
  }
  return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
}
function diasHabilesEntre(isoDesde, isoHasta){
  // Días hábiles desde isoDesde (excluido) hasta isoHasta (incluido); negativo si isoHasta < isoDesde
  if (isoHasta === isoDesde) return 0;
  const signo = isoHasta > isoDesde ? 1 : -1;
  const [a, b] = signo > 0 ? [isoDesde, isoHasta] : [isoHasta, isoDesde];
  const d = new Date(a + 'T12:00:00'); let n = 0;
  while (true){
    d.setDate(d.getDate() + 1);
    const iso = `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
    if (iso > b) break;
    if (esDiaHabil(iso)) n++;
  }
  return n * signo;
}

// Versión de cálculo de plazo usada antes de cargar el estado (con feriados base)
function sumarDiasHabilesBase(isoInicio, dias){
  const feriados = new Set(FERIADOS_BASE.map(f => f.fecha));
  const d = new Date(isoInicio + 'T12:00:00'); let c = 0;
  while (c < dias){ d.setDate(d.getDate()+1); const iso = `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; const w = d.getDay(); if (w!==0 && w!==6 && !feriados.has(iso)) c++; }
  return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
}

// Indicadores de rendimiento por sucursal (numerador, denominador) — datos de ejemplo
function indicadoresSucursal(codigo, clave = clavePeriodo()){
  const base = {
    RM01:{total:[34,48], obligatorios:[8,12], calidad:[26,35], gerencia:[21,33]},
    RM02:{total:[39,48], obligatorios:[11,12], calidad:[30,35], gerencia:[27,33]},
    RM03:{total:[31,48], obligatorios:[7,12], calidad:[24,35], gerencia:[19,33]},
    RM04:{total:[44,48], obligatorios:[12,12], calidad:[33,35], gerencia:[30,33]}
  };
  const suc = S.sucursales.find(s => s.codigo === codigo);
  if (!suc || suc.estado !== 'Activa') return null;
  let ind = base[codigo];
  if (!ind){
    const r = mulberry32(semillaDesdeTexto('ind-' + codigo));
    ind = {total:[20+Math.floor(r()*28),48], obligatorios:[6+Math.floor(r()*6),12], calidad:[18+Math.floor(r()*17),35], gerencia:[15+Math.floor(r()*18),33]};
  }
  if (esPeriodoDefecto(clave)) return ind;
  // Variación reproducible según el período elegido (simula datos históricos)
  const r = mulberry32(semillaDesdeTexto('per-' + codigo + clave));
  const variado = {};
  Object.entries(ind).forEach(([k, [n, d]]) => { variado[k] = [Math.min(d, Math.max(0, Math.round(n * (0.82 + r() * 0.3)))), d]; });
  return variado;
}
function indicadoresVista(){
  if (sucursalVista() !== 'RED') return indicadoresSucursal(sucursalVista());
  const acum = {total:[0,0], obligatorios:[0,0], calidad:[0,0], gerencia:[0,0]};
  S.sucursales.forEach(s => { const i = indicadoresSucursal(s.codigo); if (!i) return; Object.keys(acum).forEach(k => { acum[k][0] += i[k][0]; acum[k][1] += i[k][1]; }); });
  return acum;
}
function valorIndicador(codigoInd, codigoSuc, clave = clavePeriodo()){
  if (esPeriodoDefecto(clave)){
    const auditoria = codigoInd === 'REG-1.2' && S.auditorias[codigoSuc];
    if (auditoria) return auditoria.resultado;
    const criticos = codigoInd === 'AOC-1.2' && S.criticos && S.criticos.porSucursal[codigoSuc];
    if (criticos && criticos.total) return pct(criticos.notificados, criticos.total);
  }
  const r = mulberry32(semillaDesdeTexto(codigoInd + codigoSuc + (esPeriodoDefecto(clave) ? '' : clave)));
  return Math.round((40 + r() * 60) * 10) / 10;
}

/* =========================================================
   Velocímetro vectorial (escala 0-100, franjas de color, aguja y valor)
   ========================================================= */
function puntoEnDial(cx, cy, radio, valor){
  const angulo = (225 - 270 * Math.min(Math.max(valor,0),100) / 100) * Math.PI / 180;
  return [cx + radio * Math.cos(angulo), cy - radio * Math.sin(angulo)];
}
function arcoDial(cx, cy, radio, desde, hasta){
  const [x1,y1] = puntoEnDial(cx, cy, radio, desde), [x2,y2] = puntoEnDial(cx, cy, radio, hasta);
  const grande = (hasta - desde) * 2.7 > 180 ? 1 : 0;
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${radio} ${radio} 0 ${grande} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function velocimetro(valor, franjas, id){
  const cx = 110, cy = 112, colores = {rojo:'#E5484D', amarillo:'#F5C518', verde:'#2FB463'};
  let s = `<svg viewBox="0 0 220 216" role="img" aria-label="Valor ${fmtPct(valor)}">
  <defs>
    <radialGradient id="bisel${id}" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="80%" stop-color="#E9EDF2"/><stop offset="100%" stop-color="#C9D1DB"/></radialGradient>
    <linearGradient id="aro${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D5DBE3"/><stop offset="100%" stop-color="#9AA5B4"/></linearGradient>
  </defs>
  <circle cx="${cx}" cy="${cy}" r="100" fill="url(#aro${id})"/>
  <circle cx="${cx}" cy="${cy}" r="93" fill="url(#bisel${id})"/>`;
  franjas.forEach(([desde, hasta, color]) => {
    s += `<path d="${arcoDial(cx,cy,80,desde,hasta)}" fill="none" stroke="${colores[color]}" stroke-width="12"/>`;
  });
  for (let v = 0; v <= 100; v += 2){
    const mayor = v % 10 === 0;
    const [x1,y1] = puntoEnDial(cx,cy, mayor ? 88 : 86, v), [x2,y2] = puntoEnDial(cx,cy, mayor ? 72 : 74, v);
    s += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${mayor ? '#3A4250' : 'rgba(40,40,40,.45)'}" stroke-width="${mayor ? 1.6 : .8}"/>`;
    if (mayor){
      const [lx,ly] = puntoEnDial(cx,cy,60,v);
      s += `<text x="${lx.toFixed(2)}" y="${(ly+3.5).toFixed(2)}" text-anchor="middle" font-size="10" font-family="Georgia,serif" fill="#4B5563">${v}</text>`;
    }
  }
  const [nx,ny] = puntoEnDial(cx,cy,70,valor), [tx,ty] = puntoEnDial(cx,cy,-10,valor);
  s += `<line x1="${tx.toFixed(2)}" y1="${ty.toFixed(2)}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
  <circle cx="${cx}" cy="${cy}" r="6" fill="#111827"/><circle cx="${cx}" cy="${cy}" r="2" fill="#9CA3AF"/>
  <rect x="${cx-30}" y="${cy+28}" width="60" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="${cx}" y="${cy+43}" text-anchor="middle" font-size="12" font-family="Consolas,monospace" fill="#374151">${fmtPct(valor)}</text>
  </svg>`;
  return s;
}

function badgeEstadoReclamo(t){
  const op = oportunidad(t);
  return `<span class="badge ${op.clase}">${esc(op.texto)}</span>`;
}
function oportunidad(t){
  if (t.estado === 'Cerrado por GC'){
    return t.fechaRespuesta && t.fechaRespuesta <= t.fechaLimite ? {texto:'Respondido en plazo', clase:'b-ok'} : {texto:'Respondido fuera de plazo', clase:'b-danger'};
  }
  const restantes = diasHabilesEntre(isoHoy(), t.fechaLimite);
  if (restantes < 0) return {texto:`Vencido hace ${-restantes} días hábiles`, clase:'b-danger'};
  if (restantes <= 3) return {texto:`Quedan ${restantes} días hábiles`, clase:'b-warn'};
  return {texto:`Quedan ${restantes} días hábiles`, clase:'b-info'};
}

function barra(valor, umbral){
  const color = valor >= umbral ? 'var(--ok)' : valor >= umbral * 0.85 ? 'var(--warn)' : 'var(--danger)';
  return `<div class="bar"><span style="width:${Math.min(valor,100)}%;background:${color}"></span></div>`;
}
// Borradores: cualquier campo con data-borrador conserva lo escrito al cambiar de pantalla o presionar Atrás
function restaurarBorradores(){
  document.querySelectorAll('[data-borrador]').forEach(campo => {
    const clave = campo.dataset.borrador;
    if (S.borradores[clave] !== undefined) campo.value = S.borradores[clave];
    campo.addEventListener('input', () => { S.borradores[clave] = campo.value; guardarEstado(); });
  });
}
function limpiarBorradores(prefijo){ Object.keys(S.borradores).forEach(k => { if (k.startsWith(prefijo)) delete S.borradores[k]; }); }

/* =========================================================
   Enrutador (hash): el botón Atrás del navegador vuelve a la vista anterior
   ========================================================= */
const RUTAS_PUBLICAS = ['login','registro'];
const MODULO_DE_SECCION = {dashboard:'inicio', comparativo:'inicio', acreditacion:'acreditacion', seremi:'seremi', gcl:'gcl', documental:'documental', paciente:'paciente', contraloria:'contraloria'};
function rutaActual(){ return (location.hash.replace(/^#\/?/, '') || 'modulos').split('/'); }
function navegar(ruta){ location.hash = '#/' + ruta; }

let mantenerScroll = false;
function render(){
  const [seccion, ...resto] = rutaActual();
  const app = document.getElementById('app');
  if (!S.usuario && !RUTAS_PUBLICAS.includes(seccion)){ navegar('login'); return; }
  if (S.usuario && RUTAS_PUBLICAS.includes(seccion)){ navegar('modulos'); return; }
  if (seccion === 'login'){ app.innerHTML = vistaLogin(); enlazarLogin(); return; }
  if (seccion === 'registro'){ app.innerHTML = vistaRegistro(); enlazarRegistro(); return; }
  if (seccion === 'administracion' && !permisos().admin){ navegar('modulos'); return; }
  if (MODULO_DE_SECCION[seccion] && !accede(MODULO_DE_SECCION[seccion])){ navegar('modulos'); return; }

  const vistas = {
    modulos: vistaModulos, dashboard: vistaDashboard, comparativo: vistaComparativo, acreditacion: vistaAcreditacion, seremi: vistaSeremi, gcl: vistaGCL,
    documental: vistaDocumental, paciente: vistaPaciente, contraloria: vistaContraloria,
    perfil: vistaPerfil, administracion: vistaAdministracion
  };
  const vista = vistas[seccion] || vistaModulos;
  let contenido;
  try { contenido = vista(resto); }
  catch (error){
    console.error('Error al construir la vista', seccion, error);
    contenido = `<div class="card"><h2>No se pudo mostrar esta sección</h2><p class="muted">${esc(error.message)}</p><a class="btn" href="#/modulos">Volver a módulos</a></div>`;
  }
  app.innerHTML = vistaMarco(contenido);
  enlazarMarco();
  restaurarBorradores();
  const enlazadores = {dashboard:enlazarDashboard, comparativo:enlazarComparativo, acreditacion:enlazarAcreditacion, paciente:enlazarPaciente, gcl:enlazarGCL, contraloria:enlazarContraloria, administracion:enlazarAdministracion, documental:enlazarDocumental};
  if (enlazadores[seccion]) enlazadores[seccion](resto);
  // Perfiles sin edición: se bloquean los controles de edición; filtros y navegación siguen activos
  const soloLectura = (!puedeEditar() && seccion !== 'administracion') || (seccion === 'acreditacion' && !permisos().revisa);
  if (soloLectura){
    document.querySelectorAll('main button, main input, main select, main textarea').forEach(el => { if (!el.closest('[data-lectura]')) el.disabled = true; });
  }
  if (!mantenerScroll) window.scrollTo(0,0);
  mantenerScroll = false;
}

function enlazarLogin(){

    if (!usuario || !clave){ document.getElementById('lgError').textContent = 'Ingresa usuario y clave.'; return; }
    const registrado = S.usuariosRegistrados.find(u => u.usuario === usuario || u.correo === usuario);
    S.usuario = registrado || {nombre:'Usuario de demostración', usuario, correo: usuario.includes('@') ? usuario : usuario + '@cruznacional.cl', cargo:'Enfermera de Gestión Clínica y Calidad', rol:PERFIL_CALIDAD, sucursal:'RM01', sis:''};
    S.sucursalActiva = 'RED'; S.vistaSimulada = null;
    guardarEstado(); navegar('modulos');
  };
  document.getElementById('lgEntrar').addEventListener('click', entrar);
  document.getElementById('lgClave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
}

function enlazarRegistro(){
  restaurarBorradores();
  document.getElementById('rgCrear').addEventListener('click', () => {
    const valor = id => document.getElementById(id).value.trim();
    const error = document.getElementById('rgError');
    if (!valor('rgNombre') || !valor('rgUsuario') || !valor('rgCorreo') || !document.getElementById('rgClave').value){ error.textContent = 'Completa nombre, usuario, correo y clave.'; return; }
    if (!/^[^\s@]+@cruznacional\.cl$/i.test(valor('rgCorreo'))){ error.textContent = 'El correo debe terminar en @cruznacional.cl.'; return; }
    const cargo = valor('rgCargo');
    const rol = (CARGOS.find(([c]) => c === cargo) || [,'Equipo clínico'])[1];
    const nuevo = {nombre:valor('rgNombre'), usuario:valor('rgUsuario'), correo:valor('rgCorreo').toLowerCase(), cargo, rol, sucursal:valor('rgSucursal'), sis:valor('rgSis')};
    S.usuariosRegistrados.push(nuevo);
    S.usuario = nuevo; S.sucursalActiva = 'RED'; S.vistaSimulada = null;
    limpiarBorradores('registro.'); guardarEstado(); navegar('modulos');
  });
}

function buscarPorCodigo(){
  const codigo = document.getElementById('buscarCodigo').value.trim().toUpperCase();
  const mensaje = document.getElementById('buscarMensaje');
  if (!codigo){ mensaje.textContent = 'Ingresa un código.'; return; }
  const ticket = S.tickets.find(t => t.codigo.toUpperCase() === codigo);
  if (ticket && accede('paciente') && (enVista(ticket.sucursal) || (sucursalVista() === 'RED' && ticket.sucursal === CODIGO_SIN_REGISTRO) || (permisos().global))){
    if (permisos().global && ticket.sucursal !== CODIGO_SIN_REGISTRO && sucursalVista() !== 'RED' && sucursalVista() !== ticket.sucursal){ S.sucursalActiva = 'RED'; guardarEstado(); }
    if (ticket.sucursal === CODIGO_SIN_REGISTRO && permisos().global){ S.sucursalActiva = 'RED'; guardarEstado(); }
    abrirPanel(false); navegar('paciente/ticket/' + encodeURIComponent(ticket.codigo)); return;
  }
  const incidencia = S.incidencias.find(i => i.codigo.toUpperCase() === codigo);
  if (incidencia && accede('gcl') && (enVista(incidencia.sucursal) || permisos().global)){
    if (permisos().global && !enVista(incidencia.sucursal)){ S.sucursalActiva = 'RED'; guardarEstado(); }
    abrirPanel(false); navegar('gcl/incidencias/' + encodeURIComponent(incidencia.codigo)); return;
  }
  mensaje.textContent = 'No se encontró un caso con ese código o no tienes acceso a él.';
}
function enlazarMarco(){
  const sel = document.getElementById('selSucursal');
  if (sel){ sel.value = S.sucursalActiva; sel.addEventListener('change', () => { S.sucursalActiva = sel.value; guardarEstado(); mantenerScroll = true; render(); }); }
  const menu = document.getElementById('menuUsuario');
  document.getElementById('btnMenu').addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
  document.addEventListener('click', () => menu.classList.remove('open'), {once:true});
  document.getElementById('btnSalir').addEventListener('click', e => { e.preventDefault(); S.usuario = null; S.vistaSimulada = null; guardarEstado(); navegar('login'); });
  const salirSim = document.getElementById('btnSalirSimulacion');
  if (salirSim) salirSim.addEventListener('click', () => { S.vistaSimulada = null; guardarEstado(); navegar('administracion/usuarios'); });
  document.getElementById('btnPanel').addEventListener('click', () => abrirPanel(true));
  document.getElementById('btnCerrarPanel').addEventListener('click', () => abrirPanel(false));
  document.getElementById('panelFondo').addEventListener('click', () => abrirPanel(false));
  document.querySelectorAll('[data-cerrar-panel]').forEach(a => a.addEventListener('click', () => abrirPanel(false)));
  document.getElementById('btnBuscarCodigo').addEventListener('click', buscarPorCodigo);
  document.getElementById('buscarCodigo').addEventListener('keydown', e => { if (e.key === 'Enter') buscarPorCodigo(); if (e.key === 'Escape') abrirPanel(false); });
}

function vistaModulos(){
  const visibles = MODULOS.filter(([k]) => accede(k));
  return `${lineaTitulo('Módulos de trabajo', 'Selecciona el módulo al que quieres ingresar.')}
    <div class="grid g3">${visibles.map(([r,t,d]) => `<a class="card mod" href="#/${r}"><div class="n">${esc(t)}</div><div class="small muted">${esc(d)}</div></a>`).join('')}</div>`;
}
function filtroPeriodo(){
  return `<div class="row periodo" data-lectura><label for="perDesde">Desde</label><input type="month" id="perDesde" value="${esc(S.periodo.desde)}"><label for="perHasta">Hasta</label><input type="month" id="perHasta" value="${esc(S.periodo.hasta)}"></div>`;
}
function vistaDashboard(){
  const ind = indicadoresVista();
  const vista = sucursalVista();
  const titulo = vista === 'RED' ? 'Consolidado red Cruz Nacional' : nombreSucursal(vista);
  let gauges;
  if (!ind || !ind.total[1]){
    gauges = `<div class="card"><h3>Sin datos de rendimiento</h3><p class="muted">La sucursal está registrada como "${esc((S.sucursales.find(s=>s.codigo===vista)||{}).estado || '')}". Los indicadores se mostrarán cuando inicie su operación.</p></div>`;
  } else {
    const tarjetas = [
      ['Informe total', ind.total, FRANJAS_GENERAL, 'Indicadores cumplidos'],
      ['Indicadores obligatorios', ind.obligatorios, FRANJAS_OBLIGATORIOS, 'Obligatorios cumplidos'],
      ['Gestión de calidad y seguridad asistencial', ind.calidad, FRANJAS_GENERAL, 'Cumplidos'],
      ['Indicadores de gerencia', ind.gerencia, FRANJAS_GENERAL, 'Cumplidos']
    ];
    gauges = `<div class="card"><div class="row"><h2>Informe de calidad · Gráfica de rendimiento general</h2><span class="spacer"></span><span class="badge b-neutral">Período ${esc(textoPeriodo())}</span>${permisos().global ? '<a class="btn sm sec" href="#/comparativo">Armar comparativo</a>' : ''}</div>
      <div class="grid g4" style="margin-top:.8rem">${tarjetas.map(([t, [n,d], franjas, et], i) =>
      `<div class="gauge-card"><h4>${esc(t)}</h4>${velocimetro(pct(n,d), franjas, 'g'+i)}<div class="small muted">${n} / ${d} ${esc(et)}</div></div>`).join('')}</div></div>`;
  }
  const sucursalesAlerta = vista === 'RED' ? S.sucursales.filter(s => s.estado === 'Activa').map(s => s.codigo) : [vista];
  const alertas = [];
  sucursalesAlerta.forEach(cod => INDICADORES.filter(i => i.obligatorio).forEach(ind => {
    const v = valorIndicador(ind.codigo, cod);
    if (v < ind.umbral) alertas.push({cod, ind, v});
  }));
  const ticketsVencidos = S.tickets.filter(t => enVista(t.sucursal) && t.estado !== 'Cerrado por GC' && diasHabilesEntre(isoHoy(), t.fechaLimite) < 0).length;
  const incAbiertas = S.incidencias.filter(i => enVista(i.sucursal) && i.estado === 'Abierto' && enPeriodo(i.fecha)).length;
  const escalados = S.tickets.filter(t => enVista(t.sucursal) && t.externo && t.externo.estado === 'En curso').length;
  const kpi = (titulo, valor, ruta, texto) => `<div class="card"><div class="muted small">${titulo}</div><div class="kpi">${valor}</div>${accede(ruta.split('/')[0]) ? `<a href="#/${ruta}" class="small">${texto}</a>` : ''}</div>`;
  return `${migas([['Inicio']])}
    ${lineaTitulo(titulo, 'Consola de control de calidad, indicadores y cumplimiento normativo.', filtroPeriodo())}
    ${S.periodo.desde > S.periodo.hasta ? '<div class="notice">El mes "desde" es posterior al mes "hasta". Corrige el período.</div>' : ''}
    ${gauges}
    <div class="grid g4" style="margin-top:1rem">
      ${kpi('Reclamos con plazo vencido (a la fecha)', ticketsVencidos, 'paciente', 'Ver tickets')}
      ${kpi('Incidencias abiertas en el período', incAbiertas, 'gcl/incidencias', 'Ver incidencias')}
      ${kpi('Casos escalados a SERNAC / Superintendencia en curso', escalados, 'paciente', 'Ver casos')}
      ${kpi('Brechas en indicadores obligatorios', alertas.length, 'acreditacion/indicadores', 'Ver indicadores')}
    </div>
    <h2 style="margin-top:1.5rem">Tareas y brechas críticas</h2>
    <div class="card"><div class="table-wrap"><table><thead><tr><th>Sucursal</th><th>Indicador</th><th>Valor</th><th>Umbral</th><th></th></tr></thead><tbody>
      ${alertas.length ? alertas.slice(0, 12).map(a => { const destino = a.ind.codigo==='REG-1.2'?'contraloria/fichas':a.ind.codigo==='AOC-1.2'?'contraloria/criticos':'acreditacion/indicadores';
        return `<tr><td>${esc(nombreSucursal(a.cod))}</td><td><strong>${esc(a.ind.codigo)}</strong> — ${esc(a.ind.nombre)}</td><td><span class="badge b-danger">${fmtPct(a.v)}</span></td><td>≥ ${a.ind.umbral}%</td><td>${accede(destino.split('/')[0]) ? `<a class="btn sm sec" href="#/${destino}">Gestionar</a>` : ''}</td></tr>`; }).join('') : '<tr><td colspan="5" class="muted">Sin brechas en indicadores obligatorios.</td></tr>'}
    </tbody></table></div></div>`;
}
function enlazarDashboard(){
  ['perDesde','perHasta'].forEach(id => document.getElementById(id)?.addEventListener('change', () => {
    const desde = document.getElementById('perDesde').value || mesActual(), hasta = document.getElementById('perHasta').value || mesActual();
    S.periodo = {desde, hasta}; guardarEstado(); mantenerScroll = true; render();
  }));
}
// Comparativo entre sucursales, armado a pedido
function vistaComparativo(){
  if (!permisos().global) return `<div class="card"><p>El comparativo está disponible para perfiles con vista de toda la red.</p></div>`;
  const activas = S.sucursales.filter(s => s.estado === 'Activa');
  const c = S.comparativo || {sucursales: activas.map(s => s.codigo), indicadores: INDICADORES.map(i => i.codigo), desde: S.periodo.desde, hasta: S.periodo.hasta, generado:false};
  let tabla = '';
  if (c.generado){
    const clave = `${c.desde}_${c.hasta}`;
    const inds = INDICADORES.filter(i => c.indicadores.includes(i.codigo));
    const clase = (v, u) => v >= u ? 'b-ok' : v >= u * 0.85 ? 'b-warn' : 'b-danger';
    tabla = `<div class="card" style="margin-top:1rem"><div class="row"><h3>Comparativo · ${esc(textoPeriodo(c))}</h3><span class="spacer"></span><button class="btn sm sec" data-lectura onclick="window.print()">Imprimir</button></div>
      <div class="table-wrap"><table><thead><tr><th>Sucursal</th>${inds.map(i => `<th title="${esc(i.nombre)}">${esc(i.codigo)}<br><span style="text-transform:none;font-weight:400">≥ ${i.umbral}%</span></th>`).join('')}</tr></thead><tbody>
      ${c.sucursales.map(cod => `<tr><td><strong>${esc(nombreSucursal(cod))}</strong></td>${inds.map(i => { const v = valorIndicador(i.codigo, cod, clave); return `<td><span class="badge ${clase(v, i.umbral)}">${fmtPct(v)}</span></td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div><p class="small muted">Verde: cumple el umbral. Amarillo: hasta 15% bajo el umbral. Rojo: más de 15% bajo el umbral. Datos de ejemplo.</p></div>`;
  }
  return `${migas([['Inicio','#/dashboard'],['Comparativo']])}<h1>Comparativo entre sucursales</h1>
    <div class="card" data-lectura><div class="grid g3">
      <div><h4>Sucursales</h4>${activas.map(s => `<label style="font-weight:400;color:var(--text)"><input type="checkbox" style="width:auto" data-comp-suc value="${esc(s.codigo)}" ${c.sucursales.includes(s.codigo)?'checked':''}> ${esc(s.codigo+' '+s.nombre)}</label>`).join('')}</div>
      <div><h4>Indicadores</h4>${INDICADORES.map(i => `<label style="font-weight:400;color:var(--text)"><input type="checkbox" style="width:auto" data-comp-ind value="${esc(i.codigo)}" ${c.indicadores.includes(i.codigo)?'checked':''}> ${esc(i.codigo)} — ${esc(i.nombre)}</label>`).join('')}</div>
      <div><h4>Período</h4><label>Desde</label><input type="month" id="compDesde" value="${esc(c.desde)}"><label>Hasta</label><input type="month" id="compHasta" value="${esc(c.hasta)}"></div>
    </div><div id="compError" class="err"></div>
    <div class="row" style="margin-top:.8rem"><button class="btn" id="btnGenerarComp">Generar comparativo</button><a class="btn ghost" href="#/dashboard">Volver al Inicio</a></div></div>${tabla}`;
}
function enlazarComparativo(){
  const btn = document.getElementById('btnGenerarComp'); if (!btn) return;
  btn.addEventListener('click', () => {
    const sucursales = [...document.querySelectorAll('[data-comp-suc]:checked')].map(x => x.value);
    const indicadores = [...document.querySelectorAll('[data-comp-ind]:checked')].map(x => x.value);
    const desde = document.getElementById('compDesde').value, hasta = document.getElementById('compHasta').value;
    const error = document.getElementById('compError');
    if (sucursales.length < 2){ error.textContent = 'Selecciona al menos dos sucursales.'; return; }
    if (!indicadores.length){ error.textContent = 'Selecciona al menos un indicador.'; return; }
    if (!desde || !hasta || desde > hasta){ error.textContent = 'Revisa el período: "desde" debe ser anterior o igual a "hasta".'; return; }
    S.comparativo = {sucursales, indicadores, desde, hasta, generado:true}; guardarEstado(); mantenerScroll = true; render();
  });
}

// ---------- Datos iniciales del módulo (ejemplo)
function datosAcreditacionIniciales(){
  const evaluaciones = {}, datosInd = {};
  SUCURSALES_BASE.filter(s => s.estado === 'Activa').forEach(s => {
    const r = mulberry32(semillaDesdeTexto('eval-' + s.codigo));
    evaluaciones[s.codigo] = {};
    PAUTA.filter(c => aplicaEn(c, s.codigo)).forEach(c => {
      evaluaciones[s.codigo][c.codigo] = c.elementos.map(() => { const x = r(); return x < 0.82 ? 'C' : x < 0.93 ? 'N' : 'A'; });
    });
  });
  const indicadores = INDICADORES_BASE.map(([nombre, caracteristica, medicion], i) => {
    const id = 'IND-' + pad(i + 1, 2);
    const identificacion = caracteristica === 'DP-1.1';
    return {id, nombre, caracteristica, ambito: ambitoDeCaracteristica(caracteristica), tipo:'Proceso',
      descripcion: identificacion ? 'Se evaluará que los colaboradores que trabajan en Clínica Cruz Nacional porten su identificación al momento de la visita en terreno.' : 'Descripción de ejemplo del indicador.',
      criterios:'', metodologia:'', fuente:'', responsable: RESPONSABLE_ACREDITACION, digitadores: DIGITADORES_ACREDITACION,
      alcance:'RED', sucursales:[], periodicidad:'Mensual', parcial:'No', tipoUmbral:'Porcentaje', tasa:'', umbral: caracteristica === 'AOC-1.2' ? 80 : 90,
      par1: identificacion ? 'N° colaboradores que cumplen la política de identificación al momento de la visita' : 'N° de mediciones que cumplen el criterio',
      par2: identificacion ? 'N° total de colaboradores presentes supervisados' : 'N° total de mediciones realizadas',
      medicion, origen: medicion === 'Automático' ? 'Pautas de Gestión de Calidad' : '', estado:'Vigente'};
  });
  const hoy = new Date(); const mesTope = hoy.getMonth(); // meses anteriores al actual con datos
  indicadores.forEach(ind => {
    datosInd[ind.id] = {};
    SUCURSALES_BASE.filter(s => s.estado === 'Activa').forEach(s => {
      const r = mulberry32(semillaDesdeTexto(ind.id + s.codigo));
      datosInd[ind.id][s.codigo] = {};
      for (let m = 0; m < mesTope; m++){
        const p2 = 4 + Math.floor(r() * 9); const p1 = Math.max(0, p2 - (r() < 0.35 ? 1 + Math.floor(r() * 2) : 0));
        datosInd[ind.id][s.codigo][`${hoy.getFullYear()}-${pad(m + 1, 2)}`] = {p1, p2};
      }
    });
  });
  return {evaluaciones, indicadores, datosInd};
}

// ---------- Cálculos
function evaluacionDe(suc, car){ return (S.evaluaciones[suc] && S.evaluaciones[suc][car.codigo]) || car.elementos.map(() => ''); }
function estadoCaracteristica(suc, car){
  if (!aplicaEn(car, suc)) return {estado:'No corresponde', clase:'b-neutral', pct:null};
  const v = evaluacionDe(suc, car);
  const evaluados = v.filter(x => x).length;
  if (!evaluados) return {estado:'Sin evaluar', clase:'b-neutral', pct:null, avance:0};
  const aplicables = v.filter(x => x === 'C' || x === 'N').length;
  const avance = pct(evaluados, v.length);
  if (!aplicables) return {estado:'No aplica', clase:'b-neutral', pct:null, avance};
  const p = pct(v.filter(x => x === 'C').length, aplicables);
  if (evaluados < v.length) return {estado:'En evaluación', clase:'b-info', pct:p, avance};
  return p >= car.umbral ? {estado:'Cumple', clase:'b-ok', pct:p, avance} : {estado:'No cumple', clase:'b-danger', pct:p, avance};
}
function estadoCaracteristicaRed(car){
  const estados = sucursalesEvaluables().filter(s => aplicaEn(car, s)).map(s => estadoCaracteristica(s, car).estado);
  if (!estados.length) return {estado:'No corresponde', clase:'b-neutral'};
  const cumple = estados.filter(e => e === 'Cumple').length, noCumple = estados.filter(e => e === 'No cumple').length;
  if (noCumple) return {estado:`No cumple en ${noCumple} de ${estados.length}`, clase:'b-danger', cumple, total:estados.length};
  if (cumple === estados.length) return {estado:'Cumple en toda la red', clase:'b-ok', cumple, total:estados.length};
  return {estado:`Cumple en ${cumple} de ${estados.length}`, clase:'b-info', cumple, total:estados.length};
}
const estadoEnVista = (car) => sucursalVista() === 'RED' ? estadoCaracteristicaRed(car) : estadoCaracteristica(sucursalVista(), car);
const caracteristicasEnVista = () => PAUTA.filter(c => sucursalesDeVista().some(s => aplicaEn(c, s)));

const indicadorAplica = (ind, suc) => ind.alcance === 'RED' || ind.sucursales.includes(suc);
const etiquetaAlcance = (ind) => ind.alcance === 'RED' ? '[Red]' : `[${ind.sucursales.join(', ')}]`;
function resultadoMes(ind, suc, mes){
  const d = S.datosInd[ind.id]?.[suc]?.[mes];
  if (!d || d.p2 === '' || d.p2 === undefined || Number(d.p2) === 0) return null;
  const base = ind.tipoUmbral === 'Tasa' ? Number(ind.tasa || 1000) : ind.tipoUmbral === 'Índice' ? 1 : 100;
  return Math.round(Number(d.p1) / Number(d.p2) * base * 10) / 10;
}
function resultadoMesRed(ind, mes){
  let n = 0, d = 0;
  sucursalesEvaluables().filter(s => indicadorAplica(ind, s)).forEach(s => { const x = S.datosInd[ind.id]?.[s]?.[mes]; if (x && Number(x.p2)){ n += Number(x.p1); d += Number(x.p2); } });
  if (!d) return null;
  const base = ind.tipoUmbral === 'Tasa' ? Number(ind.tasa || 1000) : ind.tipoUmbral === 'Índice' ? 1 : 100;
  return Math.round(n / d * base * 10) / 10;
}
function ultimoResultado(ind){
  const anio = new Date().getFullYear();
  for (let m = 12; m >= 1; m--){
    const mes = `${anio}-${pad(m,2)}`;
    const v = sucursalVista() === 'RED' ? resultadoMesRed(ind, mes) : resultadoMes(ind, sucursalVista(), mes);
    if (v !== null) return {mes, valor:v};
  }
  return null;
}
const unidadInd = (ind) => ind.tipoUmbral === 'Porcentaje' ? '%' : ind.tipoUmbral === 'Tasa' ? ` x ${ind.tasa || '1.000'}` : '';
const badgeResultado = (ind, v) => v === null ? '<span class="muted small">Sin datos</span>' : `<span class="badge ${v >= ind.umbral ? 'b-ok' : 'b-danger'}">${v.toLocaleString('es-CL')}${unidadInd(ind)}</span>`;
function mesBloqueado(ind, suc, mes){
  const [a, m] = mes.split('-').map(Number);
  const limite = new Date(a, m, 0); limite.setDate(limite.getDate() + DIAS_BLOQUEO);
  const limiteIso = `${limite.getFullYear()}-${pad(limite.getMonth()+1,2)}-${pad(limite.getDate(),2)}`;
  return isoHoy() > limiteIso && !S.desbloqueos[`${ind.id}|${suc}|${mes}`];
}

// ---------- Vista principal del módulo
function vistaAcreditacion([seccion = 'pauta', a, b]){
  const tabs = [['pauta','Pauta de cotejo'],['indicadores','Indicadores'],['ingreso','Ingreso de datos'],['monitoreo','Monitoreo']];
  let cuerpo;
  if (seccion === 'indicadores') cuerpo = a === 'nuevo' || a === 'editar' ? formularioIndicador(b) : a === 'historial' ? historialIndicador(b) : gestionIndicadores();
  else if (seccion === 'ingreso') cuerpo = a ? ingresoIndicador(a) : listaIngreso();
  else if (seccion === 'monitoreo') cuerpo = vistaMonitoreo(a || 'obligatorias');
  else cuerpo = a ? vistaAmbito(a, b) : listaAmbitos();
  const migasExtra = seccion === 'pauta' && a ? [['Pauta de cotejo','#/acreditacion/pauta'],[nombreAmbito(a)]] : [[tabs.find(t => t[0] === seccion)?.[1] || 'Pauta de cotejo']];
  return `${migas([['Acreditación de prestadores','#/acreditacion'], ...migasExtra])}${encabezadoModulo('Acreditación de prestadores','Estándar general de atención abierta — pauta de cotejo, indicadores y monitoreo')}
    ${permisos().revisa ? '' : '<div class="notice">Este módulo es de solo visualización para tu perfil. Evalúan y digitan Gestión Clínica y Calidad y Jefa de Clínicas.</div>'}
    <div class="tabs">${tabs.map(([k,t]) => `<a href="#/acreditacion/${k}" class="${seccion===k?'on':''}">${t}</a>`).join('')}</div>${cuerpo}`;
}

    const del = cars.filter(c => c.ambito === cod);
    const cumple = del.filter(c => { const e = estadoEnVista(c); return e.estado === 'Cumple' || e.estado === 'Cumple en toda la red'; }).length;
    const v = pct(cumple, del.length);
    return `<a class="card mod" href="#/acreditacion/pauta/${cod}"><div class="n">${esc(nombre)} (${cod === 'AP' ? 'AP' : cod})</div>
      <div class="small muted">${del.length} características · ${cumple} cumplidas</div><div style="margin-top:.5rem">${barra(v, 100)}</div><div class="small">${fmtPct(v)}</div></a>`;

  } else {
    const valores = evaluacionDe(vista, car);
    matriz = `<div class="card" style="margin-top:1rem"><h3>Elementos medibles — ${esc(nombreSucursal(vista))}</h3>
      <div class="table-wrap"><table><thead><tr><th>Elemento medible</th><th style="width:300px">Evaluación</th></tr></thead><tbody>
      ${car.elementos.map((el, i) => `<tr><td>${esc(el)}</td><td><div class="seg" data-elemento="${i}">${[['C','Cumple','on-c'],['N','No cumple','on-n'],['A','No aplica','on-a']].map(([v,t,cl]) => `<button data-v="${v}" class="${valores[i]===v?cl:''}">${t}</button>`).join('')}</div></td></tr>`).join('')}
      </tbody></table></div><p class="small muted">Cada cambio queda registrado en el historial de la característica.</p></div>`;
  }
  const adj = S.adjuntos[clave] || {vinculados:[], evidencias:[]};
  const docsSugeridos = DOCUMENTOS_REALES.filter(d => d.car.some(c => c.replace(/\s+/g,' ').includes(codigoDoc(car.codigo))));
  const panelAdjuntos = vista === 'RED' ? '' : `<div class="card ${S.panelAcred === 'adjuntos' ? '' : 'oculto'}" id="panelAdjuntos" style="margin-top:1rem"><h3>Documentos de respaldo</h3>
    <div class="grid g2"><div><h4>Protocolos vinculados (Gestión Documental)</h4>
      <ul>${adj.vinculados.map(n => `<li>${esc(n)}</li>`).join('') || '<li class="muted">Sin documentos vinculados.</li>'}</ul>
      <div class="row"><select id="selDocVincular" style="max-width:420px">${docsSugeridos.concat(DOCUMENTOS_REALES.filter(d => !docsSugeridos.includes(d))).map(d => `<option>${esc(d.nombre)}</option>`).join('')}</select><button class="btn sm" id="btnVincular">Vincular</button></div>
      <p class="small muted">Se muestran primero los documentos asociados a ${esc(codigoDoc(car.codigo))}.</p></div>
    <div><h4>Evidencias del período</h4>
      <ul>${adj.evidencias.map(e => `<li>${esc(e.nombre)} <span class="small muted">(${esc(e.fecha)} · ${esc(e.usuario)})</span></li>`).join('') || '<li class="muted">Sin evidencias cargadas.</li>'}</ul>
      <input type="file" id="fileEvidencia" style="width:auto"><p class="small muted">Maqueta: se registra solo el nombre del archivo; no se almacena el contenido.</p></div></div></div>`;
  const panelObs = vista === 'RED' ? '' : `<div class="card ${S.panelAcred === 'observaciones' ? '' : 'oculto'}" id="panelObservaciones" style="margin-top:1rem"><h3>Observaciones</h3>
    <textarea id="txtObsCar">${esc(S.obsCar[clave] || '')}</textarea><div class="row" style="margin-top:.6rem"><button class="btn" id="btnGuardarObs">Guardar observaciones</button></div></div>`;
  const inds = S.indicadores.filter(i => i.estado === 'Vigente' && i.ambito === amb && sucursalesDeVista().some(s => indicadorAplica(i, s)));
  const tablaInd = `<div class="card" style="margin-top:1rem"><h3>Cumplimiento de indicadores del ámbito</h3><div class="table-wrap"><table><thead><tr><th>Indicador</th><th>Característica</th><th>Umbral</th><th>Último resultado</th><th></th></tr></thead><tbody>
    ${inds.map(i => { const u = ultimoResultado(i); return `<tr><td>${esc(etiquetaAlcance(i))} ${esc(i.nombre)}</td><td>${esc(i.caracteristica)}</td><td>≥ ${i.umbral}${unidadInd(i)}</td><td>${u ? badgeResultado(i, u.valor) + ` <span class="small muted">${esc(MESES[Number(u.mes.split('-')[1]) - 1])}</span>` : '<span class="muted small">Sin datos</span>'}</td><td><a class="btn sm sec" href="#/acreditacion/ingreso/${i.id}">Ver datos</a></td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">Sin indicadores vigentes para este ámbito.</td></tr>'}
    </tbody></table></div></div>`;
  return filtros + ficha + panelAdjuntos + panelObs + matriz + tablaInd + tablaHistorial(`CAR:${car.codigo}|${vista === 'RED' ? '' : vista}`, 'Historial de la característica');
}

function ingresoIndicador(id){

  if (!ind) return '<div class="card"><p>Indicador no encontrado.</p></div>';

  const vista = sucursalVista();
  const info = `<div class="card"><div class="row"><h3>Información del indicador</h3><span class="spacer"></span><a class="btn sm ghost" href="#/acreditacion/ingreso">Volver al listado</a></div>

      <tr><th>Parámetro 1</th><td>${esc(ind.par1)}</td></tr><tr><th>Parámetro 2</th><td>${esc(ind.par2)}</td></tr>
      <tr><th>Fórmula</th><td>(Par1) / (Par2)${ind.tipoUmbral === 'Porcentaje' ? ' x 100' : ind.tipoUmbral === 'Tasa' ? ' x ' + esc(ind.tasa) : ''}</td></tr>
      <tr><th>Umbral</th><td>≥ ${ind.umbral}${unidadInd(ind)} · ${esc(ind.periodicidad)} · Se mide: ${esc(ind.medicion)}${ind.origen ? ' (origen: ' + esc(ind.origen) + ')' : ''}</td></tr>
    </tbody></table></div>`;
  const selAnio = `<div class="row" data-lectura><label for="selAnio" style="margin:0">Año</label><select id="selAnio" style="width:auto">${[anio - 1, anio].map(a => `<option ${a===anio?'selected':''}>${a}</option>`).join('')}</select></div>`;
  if (vista === 'RED'){
    const sucs = sucursalesEvaluables().filter(s => indicadorAplica(ind, s));
    return info + `<div class="card" style="margin-top:1rem"><div class="row"><h3>Resultados ${anio} — consolidado</h3><span class="spacer"></span>${selAnio}</div>
      <p class="small muted">Para ingresar datos, selecciona una sucursal en el selector superior.</p>
      <div class="table-wrap"><table><thead><tr><th>Mes</th>${sucs.map(s => `<th>${esc(s)}</th>`).join('')}<th>Red</th></tr></thead><tbody>
      ${MESES.map((m, i) => { const mes = `${anio}-${pad(i+1,2)}`; return `<tr><td>${m}</td>${sucs.map(s => `<td>${badgeResultado(ind, resultadoMes(ind, s, mes))}</td>`).join('')}<td>${badgeResultado(ind, resultadoMesRed(ind, mes))}</td></tr>`; }).join('')}
      </tbody></table></div></div>${tablaHistorial('IND:' + id)}`;
  }
  if (!indicadorAplica(ind, vista)) return info + `<div class="card" style="margin-top:1rem"><p>Este indicador no aplica a ${esc(nombreSucursal(vista))}.</p></div>`;
  const esCal = perfilEfectivo().rol === PERFIL_CALIDAD;
  const tarjetas = MESES.map((m, i) => {
    const mes = `${anio}-${pad(i+1,2)}`;
    const d = S.datosInd[ind.id]?.[vista]?.[mes] || {p1:'', p2:''};
    const futuro = mes > mesActual();
    const bloqueado = !futuro && mesBloqueado(ind, vista, mes);
    const deshab = futuro || bloqueado ? 'disabled' : '';
    return `<div class="mes-card ${bloqueado ? 'bloqueado' : ''}"><div class="mes-titulo">${m}</div>
      <label>Parámetro 1</label><input type="number" min="0" data-mes="${mes}" data-par="p1" value="${esc(d.p1)}" ${deshab} data-campo-mes>
      <label>Parámetro 2</label><input type="number" min="0" data-mes="${mes}" data-par="p2" value="${esc(d.p2)}" ${deshab} data-campo-mes>
      <div class="small" style="margin-top:.3rem">Resultado: ${badgeResultado(ind, resultadoMes(ind, vista, mes))}</div>
      ${bloqueado ? `<div class="small muted">Bloqueado (${DIAS_BLOQUEO} días desde el cierre)</div>${esCal ? `<span data-lectura><button class="btn sm ghost" data-desbloquear="${mes}">Desbloquear</button></span>` : ''}` : ''}</div>`;
  }).join('');
  const claveAdj = `IND:${ind.id}|${vista}|${anio}`;
  const adj = S.adjuntos[claveAdj] || {vinculados:[], evidencias:[]};
  return info + `<div class="card" style="margin-top:1rem"><div class="row"><h3>Parámetros ${anio} — ${esc(nombreSucursal(vista))}</h3><span class="spacer"></span>${selAnio}</div>

    <div class="row" style="margin-top:.8rem"><button class="btn" id="btnGrabarDatos">Grabar datos</button><span id="ingMensaje" class="small muted"></span></div></div>

      <div class="card"><h3>Documentos</h3><ul>${adj.evidencias.map(e => `<li>${esc(e.nombre)} <span class="small muted">(${esc(e.fecha)})</span></li>`).join('') || '<li class="muted">Sin documentos.</li>'}</ul><input type="file" id="fileDocInd" style="width:auto"><p class="small muted">Maqueta: se registra solo el nombre del archivo.</p></div>
    </div>${tablaHistorial('IND:' + id)}`;
}

// ---------- Monitoreo de características
function vistaMonitoreo(sub){
  const tabs = [['obligatorias','Características obligatorias'],['todas','Todas las características'],['consolidado','Consolidado global']];
  const cars = caracteristicasEnVista();
  let cuerpo;
  if (sub === 'todas'){
    const sucs = sucursalVista() === 'RED' ? sucursalesEvaluables() : [sucursalVista()];
    cuerpo = `<div class="card"><div class="table-wrap"><table><thead><tr><th>Característica</th><th>Descripción</th><th>Umbral</th>${sucs.map(s => `<th>${esc(s)}</th>`).join('')}</tr></thead><tbody>
      ${cars.map(c => `<tr><td><a href="#/acreditacion/pauta/${c.ambito}/${c.codigo}"><strong>${esc(c.codigo)}</strong></a>${c.obligatoria ? ' <span class="badge b-danger">Oblig.</span>' : ''}</td><td class="small">${esc(c.descripcion)}</td><td>${c.umbral}%</td>
        ${sucs.map(s => { const e = estadoCaracteristica(s, c); return `<td><span class="badge ${e.clase}">${esc(e.estado)}</span>${e.pct !== null && e.pct !== undefined ? `<div class="small">${fmtPct(e.pct)}</div>` : ''}</td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div></div>`;
  } else if (sub === 'consolidado'){
    const sucs = sucursalesEvaluables();
    const celda = (lista, s) => { const aplican = lista.filter(c => aplicaEn(c, s)); const ok = aplican.filter(c => estadoCaracteristica(s, c).estado === 'Cumple').length; const v = pct(ok, aplican.length); return aplican.length ? `<td>${barra(v, 100)}<span class="small">${ok}/${aplican.length} · ${fmtPct(v)}</span></td>` : '<td class="muted">—</td>'; };
    const celdaRed = (lista) => { let ok = 0, tot = 0; sucs.forEach(s => lista.filter(c => aplicaEn(c, s)).forEach(c => { tot++; if (estadoCaracteristica(s, c).estado === 'Cumple') ok++; })); const v = pct(ok, tot); return `<td>${barra(v, 100)}<span class="small"><strong>${fmtPct(v)}</strong></span></td>`; };
    cuerpo = `<div class="card"><p class="small muted">Características cumplidas sobre las que aplican en cada sucursal. La columna Red suma todas las sucursales.</p><div class="table-wrap"><table><thead><tr><th>Ámbito</th>${sucs.map(s => `<th>${esc(s)}</th>`).join('')}<th>Red</th></tr></thead><tbody>
      ${AMBITOS_PAUTA.map(([cod, nombre]) => { const lista = PAUTA.filter(c => c.ambito === cod); return `<tr><td><strong>${esc(nombre)}</strong></td>${sucs.map(s => celda(lista, s)).join('')}${celdaRed(lista)}</tr>`; }).join('')}
      <tr><td><strong>Obligatorias</strong></td>${sucs.map(s => celda(PAUTA.filter(c => c.obligatoria), s)).join('')}${celdaRed(PAUTA.filter(c => c.obligatoria))}</tr>
      <tr><td><strong>Total</strong></td>${sucs.map(s => celda(PAUTA, s)).join('')}${celdaRed(PAUTA)}</tr>
      </tbody></table></div></div>`;
  } else {
    const obligatorias = cars.filter(c => c.obligatoria);
    const color = (c) => { const e = estadoEnVista(c); return e.clase === 'b-ok' ? 'chip-ok' : e.clase === 'b-danger' ? 'chip-no' : 'chip-sin'; };
    cuerpo = `<div class="grid g3">${AMBITOS_PAUTA.filter(([cod]) => obligatorias.some(c => c.ambito === cod)).map(([cod, nombre]) => `<div class="card"><h4 style="text-align:center">${esc(nombre)}</h4><div class="row" style="justify-content:center">
      ${obligatorias.filter(c => c.ambito === cod).map(c => `<a class="chip ${color(c)}" href="#/acreditacion/pauta/${c.ambito}/${c.codigo}" title="${esc(estadoEnVista(c).estado)}">${esc(c.codigo)}</a>`).join('')}</div></div>`).join('')}</div>
      <p class="small muted">Verde: cumple · Rojo: no cumple${sucursalVista() === 'RED' ? ' en al menos una sucursal' : ''} · Gris: sin evaluar o en evaluación.</p>`;
  }
  return `<div class="tabs" style="border-bottom-width:1px">${tabs.map(([k,t]) => `<a href="#/acreditacion/monitoreo/${k}" class="${sub===k?'on':''}">${t}</a>`).join('')}</div>${cuerpo}`;
}

// ---------- Eventos del módulo
function enlazarAcreditacion([seccion = 'pauta', a, b]){
  const buscar = document.getElementById('buscarIndicador');
  if (buscar){ const f = () => { const q = normalizar(buscar.value); document.querySelectorAll('#tablaIndicadores tbody tr[data-texto]').forEach(tr => tr.style.display = !q || tr.dataset.texto.includes(q) ? '' : 'none'); }; buscar.addEventListener('input', f); }
  document.querySelectorAll('#tablaIndicadores tr[data-ir]').forEach(tr => tr.addEventListener('click', () => navegar(tr.dataset.ir)));
  document.querySelectorAll('[data-filtro-ind]').forEach(btn => btn.addEventListener('click', () => { S.filtroIndicadores = btn.dataset.filtroInd; guardarEstado(); mantenerScroll = true; render(); }));
  document.querySelectorAll('[data-estado-ind]').forEach(btn => btn.addEventListener('click', () => {
    const [id, estado] = btn.dataset.estadoInd.split('|'); const ind = S.indicadores.find(i => i.id === id);
    registrarHistorial('IND:' + id, 'Cambio de estado del indicador', ind.estado, estado); ind.estado = estado; guardarEstado(); mantenerScroll = true; render();
  }));
  // Pauta
  const selComp = document.getElementById('selComponente');
  if (selComp){
    selComp.addEventListener('change', () => { const primera = caracteristicasEnVista().find(c => c.ambito === a && c.componente === selComp.value); navegar(`acreditacion/pauta/${a}/${primera.codigo}`); });
    document.getElementById('selCaracteristica').addEventListener('change', e => navegar(`acreditacion/pauta/${a}/${e.target.value}`));
  }
  const carActual = a ? (caracteristicasEnVista().filter(c => c.ambito === a).find(c => c.codigo === b) || caracteristicasEnVista().find(c => c.ambito === a)) : null;
  document.querySelectorAll('.seg[data-elemento] button').forEach(btn => btn.addEventListener('click', () => {
    const suc = sucursalVista(), i = Number(btn.parentElement.dataset.elemento);
    S.evaluaciones[suc] = S.evaluaciones[suc] || {};
    const actual = evaluacionDe(suc, carActual).slice();
    const etiqueta = {C:'Cumple', N:'No cumple', A:'No aplica', '':'Sin evaluar'};
    registrarHistorial(`CAR:${carActual.codigo}|${suc}`, `Elemento ${i + 1} (${suc})`, etiqueta[actual[i]], etiqueta[btn.dataset.v]);
    actual[i] = btn.dataset.v; S.evaluaciones[suc][carActual.codigo] = actual; guardarEstado(); mantenerScroll = true; render();
  }));
  const alternar = (panel) => { S.panelAcred = S.panelAcred === panel ? '' : panel; guardarEstado(); mantenerScroll = true; render(); };
  document.getElementById('btnAdjuntos')?.addEventListener('click', () => alternar('adjuntos'));
  document.getElementById('btnObservaciones')?.addEventListener('click', () => alternar('observaciones'));
  if (carActual){
    const clave = `${sucursalVista()}|${carActual.codigo}`;
    const adj = () => (S.adjuntos[clave] = S.adjuntos[clave] || {vinculados:[], evidencias:[]});
    document.getElementById('btnVincular')?.addEventListener('click', () => { const n = document.getElementById('selDocVincular').value; if (!adj().vinculados.includes(n)){ adj().vinculados.push(n); registrarHistorial(`CAR:${carActual.codigo}|${sucursalVista()}`, 'Protocolo vinculado', '', n); } guardarEstado(); mantenerScroll = true; render(); });
    document.getElementById('fileEvidencia')?.addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; adj().evidencias.push({nombre:f.name, fecha:isoHoy(), usuario:S.usuario.nombre}); registrarHistorial(`CAR:${carActual.codigo}|${sucursalVista()}`, 'Evidencia cargada', '', f.name); guardarEstado(); mantenerScroll = true; render(); });
    document.getElementById('btnGuardarObs')?.addEventListener('click', () => { const t = document.getElementById('txtObsCar').value; registrarHistorial(`CAR:${carActual.codigo}|${sucursalVista()}`, 'Observaciones actualizadas', S.obsCar[clave] || '', t); S.obsCar[clave] = t; guardarEstado(); mantenerScroll = true; render(); });
  }
  // Formulario de indicador
  const btnGuardar = document.getElementById('btnGuardarIndicador');
  if (btnGuardar){
    const selAmb = document.getElementById('fiAmbito'), selCar = document.getElementById('fiCaracteristica');
    const filtrarCar = () => { [...selCar.options].forEach(o => o.hidden = o.dataset.amb !== selAmb.value); if (selCar.selectedOptions[0]?.hidden){ const p = [...selCar.options].find(o => !o.hidden); if (p) selCar.value = p.value; } };
    selAmb.addEventListener('change', filtrarCar); filtrarCar();
    btnGuardar.addEventListener('click', () => {
      const v = id => document.getElementById(id).value.trim();
      const error = document.getElementById('fiError');
      const alcance = document.querySelector('input[name="fiAlcance"]:checked').value;
      const sucursales = [...document.querySelectorAll('[data-fi-suc]:checked')].map(x => x.value);
      if (!v('fiNombre')){ error.textContent = 'Ingresa el nombre del indicador.'; return; }
      if (alcance === 'SUC' && !sucursales.length){ error.textContent = 'Selecciona al menos una sucursal o elige "Toda la red".'; return; }
      if (!v('fiPar1') || !v('fiPar2')){ error.textContent = 'Define el parámetro 1 y el parámetro 2.'; return; }
      const umbral = Number(v('fiUmbral')); if (!(umbral >= 0)){ error.textContent = 'El umbral debe ser un número mayor o igual a 0.'; return; }
      const datos = {nombre:v('fiNombre'), caracteristica:selCar.value, ambito:selAmb.value, tipo:v('fiTipo'), descripcion:v('fiDescripcion'), criterios:v('fiCriterios'), metodologia:v('fiMetodologia'), fuente:v('fiFuente'),
        responsable:v('fiResponsable'), digitadores:DIGITADORES_ACREDITACION, alcance: alcance === 'RED' ? 'RED' : 'SUC', sucursales: alcance === 'RED' ? [] : sucursales,
        periodicidad:v('fiPeriodicidad'), parcial:v('fiParcial'), tipoUmbral:v('fiTipoUmbral'), tasa:v('fiTasa'), umbral, par1:v('fiPar1'), par2:v('fiPar2'), medicion:v('fiMedicion')};
      datos.origen = datos.medicion === 'Automático' ? 'Pautas de Gestión de Calidad' : '';
      const id = btnGuardar.dataset.id;
      if (id){
        const ind = S.indicadores.find(i => i.id === id);
        Object.keys(datos).forEach(k => { if (JSON.stringify(ind[k]) !== JSON.stringify(datos[k])) registrarHistorial('IND:' + id, 'Modificación: ' + k, Array.isArray(ind[k]) ? ind[k].join(', ') : ind[k], Array.isArray(datos[k]) ? datos[k].join(', ') : datos[k]); });
        Object.assign(ind, datos);
      } else {
        const nuevo = {id: 'IND-' + pad(S.indicadores.length + 1, 2), ...datos, estado:'Vigente'};
        S.indicadores.push(nuevo); S.datosInd[nuevo.id] = {};
        registrarHistorial('IND:' + nuevo.id, 'Indicador creado', '', `${etiquetaAlcance(nuevo)} ${nuevo.nombre}`);
      }
      guardarEstado(); navegar('acreditacion/indicadores');
    });
  }
  // Ingreso de datos
  document.getElementById('selAnio')?.addEventListener('change', e => { S.anioIngreso = Number(e.target.value); guardarEstado(); mantenerScroll = true; render(); });
  const btnGrabar = document.getElementById('btnGrabarDatos');
  if (btnGrabar && seccion === 'ingreso'){
    const ind = S.indicadores.find(i => i.id === a), suc = sucursalVista();
    btnGrabar.addEventListener('click', () => {
      const error = document.getElementById('ingError'); error.textContent = '';
      const porMes = {};
      document.querySelectorAll('[data-campo-mes]:not([disabled])').forEach(inp => { (porMes[inp.dataset.mes] = porMes[inp.dataset.mes] || {})[inp.dataset.par] = inp.value; });
      for (const [mes, d] of Object.entries(porMes)){
        if (d.p1 === '' && d.p2 === '') continue;
        if (d.p1 === '' || d.p2 === '' || Number(d.p1) < 0 || Number(d.p2) <= 0){ error.textContent = `Revisa ${MESES[Number(mes.split('-')[1]) - 1]}: ambos parámetros son obligatorios y el parámetro 2 debe ser mayor que 0.`; return; }
        if (ind.tipoUmbral === 'Porcentaje' && Number(d.p1) > Number(d.p2)){ error.textContent = `Revisa ${MESES[Number(mes.split('-')[1]) - 1]}: en un porcentaje el parámetro 1 no puede superar al parámetro 2.`; return; }
      }
      S.datosInd[ind.id] = S.datosInd[ind.id] || {}; S.datosInd[ind.id][suc] = S.datosInd[ind.id][suc] || {};
      let cambios = 0;
      Object.entries(porMes).forEach(([mes, d]) => {
        const previo = S.datosInd[ind.id][suc][mes] || {p1:'', p2:''};
        if (String(previo.p1) === String(d.p1) && String(previo.p2) === String(d.p2)) return;
        registrarHistorial('IND:' + ind.id, `Dato ${MESES[Number(mes.split('-')[1]) - 1]} ${mes.split('-')[0]} (${suc})`, previo.p1 === '' ? '' : `${previo.p1} / ${previo.p2}`, d.p1 === '' ? '(vacío)' : `${d.p1} / ${d.p2}`);
        if (d.p1 === '' && d.p2 === '') delete S.datosInd[ind.id][suc][mes]; else S.datosInd[ind.id][suc][mes] = {p1:Number(d.p1), p2:Number(d.p2)};
        cambios++;
      });
      guardarEstado(); mantenerScroll = true; render();
      const msg = document.getElementById('ingMensaje'); if (msg) msg.textContent = cambios ? `${cambios} mes(es) grabado(s).` : 'No había cambios por grabar.';
    });
    document.querySelectorAll('[data-desbloquear]').forEach(btn => btn.addEventListener('click', () => {
      const mes = btn.dataset.desbloquear;
      const motivo = (window.prompt(`Motivo del desbloqueo de ${MESES[Number(mes.split('-')[1]) - 1]} ${mes.split('-')[0]} (${suc}):`) || '').trim();
      if (!motivo){ document.getElementById('ingError').textContent = 'El desbloqueo requiere indicar un motivo.'; return; }
      S.desbloqueos[`${ind.id}|${suc}|${mes}`] = true;
      registrarHistorial('IND:' + ind.id, `Desbloqueo ${mes} (${suc}) — motivo: ${motivo}`, 'Bloqueado', 'Desbloqueado');
      guardarEstado(); mantenerScroll = true; render();
    }));
    const claveAdj = `IND:${ind.id}|${suc}|${S.anioIngreso || new Date().getFullYear()}`;
    document.getElementById('btnObsInd')?.addEventListener('click', () => { S.obsCar[claveAdj] = document.getElementById('txtObsInd').value; registrarHistorial('IND:' + ind.id, `Observaciones (${suc})`, '', S.obsCar[claveAdj]); guardarEstado(); mantenerScroll = true; render(); });
    document.getElementById('fileDocInd')?.addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; (S.adjuntos[claveAdj] = S.adjuntos[claveAdj] || {vinculados:[], evidencias:[]}).evidencias.push({nombre:f.name, fecha:isoHoy(), usuario:S.usuario.nombre}); registrarHistorial('IND:' + ind.id, `Documento cargado (${suc})`, '', f.name); guardarEstado(); mantenerScroll = true; render(); });
  }
}

/* =========================================================
   2. Visita SEREMI
   ========================================================= */
function vistaSeremi([tab = 'documentos']){
  const vista = sucursalVista();
  const codigos = vista === 'RED' ? S.sucursales.filter(s => s.estado !== 'Inactiva').map(s => s.codigo) : [vista];
  const docs = [['Resolución sanitaria de autorización — sala de procedimientos',0],['Autorización de instalación radiológica',0],['Autorizaciones de desempeño de operadores de rayos X',1],['Plan de manejo de REAS (DS N° 6)',1],['Patente comercial',1],['Certificados de mantención de equipos',1],
    ['Resolución sanitaria box dental (box de procedimientos)',2],['Autorización de instalación radiológica dental',2],['Autorizaciones de desempeño de operadores — radiografía dental',2]];
  const BOX_DENTAL = 'RM05';
  let cuerpo;
  if (tab === 'documentos'){
    const filas = [];
    codigos.forEach(c => docs.forEach(([nombre, tipo]) => {
      if (tipo === 2 && c !== BOX_DENTAL) return;
      const enApertura = (S.sucursales.find(s => s.codigo === c) || {}).estado === 'Por abrir';
      const r = mulberry32(semillaDesdeTexto(nombre + c));
      const emision = new Date(); emision.setDate(emision.getDate() - Math.floor(r() * 900));
      const vence = new Date(emision); vence.setFullYear(vence.getFullYear() + (tipo === 0 ? 3 : 1));
      const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
      const dias = Math.round((vence - new Date()) / 86400000);
      const tramite = tipo === 2 || enApertura;
      const estado = tramite ? ['En trámite','b-info'] : dias < 0 ? ['Vencido','b-danger'] : dias < 60 ? ['Por renovar','b-warn'] : ['Vigente','b-ok'];
      filas.push(`<tr><td>${esc(c)}</td><td>${esc(nombre)}</td><td>${tramite?'—':fmtFecha(iso(emision))}</td><td>${tramite?'—':fmtFecha(iso(vence))}</td><td><span class="badge ${estado[1]}">${estado[0]}</span></td><td><button class="btn sm sec" disabled title="Disponible en la plataforma definitiva">Ver PDF</button></td></tr>`);
    }));
    cuerpo = `<div class="card"><h3>Documentación obligatoria por sucursal</h3><div class="table-wrap"><table><thead><tr><th>Sucursal</th><th>Documento</th><th>Emisión</th><th>Vencimiento</th><th>Estado</th><th></th></tr></thead><tbody>${filas.join('')}</tbody></table></div></div>`;
  } else if (tab === 'guia'){
    cuerpo = `<div class="card"><h3>Guía para el personal ante una fiscalización de la Autoridad Sanitaria</h3>
      <p>Al recibir a la Autoridad Sanitaria, el personal debe solicitar la identificación de los fiscalizadores y dar aviso inmediato al Gerente de Sucursal y al Área Clínica y Calidad. La carpeta de fiscalización de esta plataforma reúne la documentación vigente para exhibirla sin demora.</p>
      <p>Durante la visita se acompaña a los fiscalizadores, se responde solo lo consultado y se registra cada documento entregado o solicitado. Si algún antecedente no está disponible, se informa la fecha comprometida de entrega.</p>
      <p>Al finalizar, se revisa el acta antes de firmarla, se solicita copia y se carga en la sección de actas para su seguimiento.</p>
      <p class="small muted">Texto de ejemplo. El contenido definitivo debe validarse con el protocolo institucional vigente.</p></div>`;
  } else {
    cuerpo = `<div class="card"><h3>Actas de fiscalización anteriores</h3><div class="table-wrap"><table><thead><tr><th>Sucursal</th><th>Fecha</th><th>Materia</th><th>Resultado</th><th>Seguimiento</th></tr></thead><tbody>
      ${codigos.filter(c => (S.sucursales.find(s => s.codigo === c) || {}).estado === 'Activa').map((c,i) => `<tr><td>${esc(c)}</td><td>${fmtFecha(`2026-0${(i%8)+1}-1${i}`)}</td><td>${['Inspección general','Protección radiológica','Manejo de REAS','Infraestructura'][i%4]}</td><td><span class="badge ${i%3?'b-ok':'b-warn'}">${i%3?'Sin observaciones':'Con observaciones'}</span></td><td>${i%3?'—':'Plan de acción en curso'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  }
  return `${migas([['Visita SEREMI']])}${encabezadoModulo('Visita SEREMI','Carpeta de fiscalización de la Autoridad Sanitaria')}
    <div class="tabs">${[['documentos','Documentación obligatoria'],['guia','Guía para el personal'],['actas','Actas de fiscalización']].map(([k,t]) => `<a href="#/seremi/${k}" class="${tab===k?'on':''}">${t}</a>`).join('')}</div>${cuerpo}`;
}

/* =========================================================
   3. Gestión de calidad (GCL) — incluye Incidencias por sucursal
   ========================================================= */
function tabGCL(tab){ const permitidas = permisos().gclTabs || ['autogestion','supervision','visitas','incidencias']; return permitidas.includes(tab) ? tab : permitidas[0]; }
function vistaGCL([tabPedida = 'autogestion', codigo]){
  const tab = tabGCL(tabPedida);
  if (tab !== tabPedida) codigo = undefined;
  const permitidas = permisos().gclTabs || ['autogestion','supervision','visitas','incidencias'];
  const tabs = [['autogestion','Autogestión (129 ítems)'],['supervision','Dashboard interno'],['visitas','Visitas y planes de acción'],['incidencias','Incidencias por sucursal']].filter(([k]) => permitidas.includes(k));
  let cuerpo;
  if (tab === 'autogestion'){
    cuerpo = `<div class="card"><h3>Pauta de autogestión de calidad para Gerentes de Sucursal</h3>
      <p>Cuestionario de 129 ítems con lógica condicional "En gestión" (área, mes/año y medio), contraloría de bodega 3+3 y entrevistas al equipo.</p>
      <div class="row"><a class="btn" href="https://calidad-ccn.github.io/autogestion_calidad/" target="_blank" rel="noopener">Abrir versión actual</a><span class="small muted">Se abre en una pestaña nueva. Integración pendiente para la etapa de desarrollo.</span></div></div>`;
  } else if (tab === 'supervision'){
    cuerpo = `<div class="card"><h3>Dashboard de supervisión interna de la red</h3>
      <p>Consola del Área Clínica y Calidad para consolidar métricas, ingresar resultados de visitas y monitorear tendencias multisucursal.</p>
      <div class="row"><a class="btn" href="https://calidad-ccn.github.io/dashboard-calidad-interno1/" target="_blank" rel="noopener">Abrir versión actual</a><span class="small muted">Se abre en una pestaña nueva. Integración pendiente para la etapa de desarrollo.</span></div></div>`;
  } else if (tab === 'visitas'){
    const cods = S.sucursales.filter(s => s.estado === 'Activa' && enVista(s.codigo)).map(s => s.codigo);
    cuerpo = `<div class="card"><h3>Historial de visitas mensuales en terreno</h3><div class="table-wrap"><table><thead><tr><th>Sucursal</th><th>Mes</th><th>Resultado visita</th><th>Hallazgos</th><th>Plan de acción</th></tr></thead><tbody>
      ${cods.flatMap(c => ['Agosto 2026','Septiembre 2026','Octubre 2026'].map((m, i) => { const r = mulberry32(semillaDesdeTexto(c+m)); const v = Math.round((60 + r()*38)*10)/10; const h = Math.floor(r()*6);
        return `<tr><td>${esc(c)}</td><td>${m}</td><td>${barra(v,90)}<span class="small">${fmtPct(v)}</span></td><td>${h}</td><td><span class="badge ${h===0?'b-neutral':i===2?'b-warn':'b-ok'}">${h===0?'No requiere':i===2?'En curso':'Cerrado'}</span></td></tr>`; })).join('')}
    </tbody></table></div><p class="small muted">Los informes PDF con velocímetros se generarán en la plataforma definitiva.</p></div>`;
  } else if (codigo){
    cuerpo = detalleIncidencia(codigo);
  } else {
    const lista = S.incidencias.filter(i => enVista(i.sucursal)).sort((a,b) => b.fecha.localeCompare(a.fecha));
    const claseG = g => ({'Baja':'b-neutral','Media':'b-info','Alta':'b-warn','CRÍTICA':'b-danger'}[g]);
    const botonRegistro = permisos().registraIncidencias
      ? (URL_FORM_INCIDENCIAS ? `<a class="btn" data-lectura href="${esc(URL_FORM_INCIDENCIAS)}" target="_blank" rel="noopener">Registrar incidencia</a>` : `<span data-lectura><button class="btn" id="btnIncSinEnlace">Registrar incidencia</button></span>`) : '';
    cuerpo = `<div class="card"><div class="row"><h3>Incidencias por sucursal</h3><span class="spacer"></span>${botonRegistro}
        <span data-lectura class="row"><select id="filtroIncArea" style="width:auto" data-borrador="inc.filtroArea"><option value="">Todas las áreas</option>${AREAS_INCIDENCIA.map(a => `<option>${esc(a)}</option>`).join('')}</select>
        <select id="filtroIncEstado" style="width:auto" data-borrador="inc.filtroEstado"><option value="">Todos los estados</option><option>Abierto</option><option>Resuelto</option></select></span></div>
      <p class="small muted">Estructura del Reporte Gerencial de Incidentes. Cada Gerente de Sucursal ve solo las incidencias de su sucursal.</p>
      <div class="table-wrap"><table id="tablaInc"><thead><tr><th>Ticket</th><th>Sucursal</th><th>Fecha</th><th>Área</th><th>Gravedad</th><th>Urgencia / SLA</th><th>Asignado a</th><th>Estado</th></tr></thead><tbody>
        ${lista.map(i => `<tr class="click" data-area="${esc(i.area)}" data-estado="${esc(i.estado)}" data-ir="gcl/incidencias/${esc(i.codigo)}"><td><strong>${esc(i.codigo)}</strong>${i.eventoAdverso ? ' <span class="badge b-danger">Evento adverso</span>' : ''}</td><td>${esc(i.sucursal)}</td><td>${fmtFecha(i.fecha)}</td><td>${esc(i.area)}</td><td><span class="badge ${claseG(i.gravedad)}">${esc(i.gravedad)}</span></td><td>${esc(i.urgencia)} · ${esc(i.sla)}</td><td>${esc(i.asignadoA)}</td><td><span class="badge ${i.estado==='Resuelto'?'b-ok':'b-warn'}">${esc(i.estado)}</span></td></tr>`).join('') || '<tr><td colspan="8" class="muted">Sin incidencias para esta vista.</td></tr>'}
      </tbody></table></div></div>`;
  }
  return `${migas([['Gestión de calidad','#/gcl'], ...(codigo ? [['Incidencias','#/gcl/incidencias'],[codigo]] : [])])}${encabezadoModulo('Gestión de calidad (GCL)','Pautas de supervisión, indicadores, visitas e incidencias')}
    <div class="tabs">${tabs.map(([k,t]) => `<a href="#/gcl/${k}" class="${tab===k?'on':''}">${t}</a>`).join('')}</div>${cuerpo}`;
}
function detalleIncidencia(codigo){
  const i = S.incidencias.find(x => x.codigo === codigo);
  if (!i || !enVista(i.sucursal)) return `<div class="card"><p>No se encontró la incidencia o no tienes acceso a esta sucursal.</p></div>`;
  return `<div class="grid g2"><div class="card"><h3>${esc(i.codigo)}</h3>
      <table><tbody>
      ${[['Sucursal',nombreSucursal(i.sucursal)],['Fecha del incidente',fmtFecha(i.fecha)],['Área involucrada',i.area],['¿Es recurrente?',i.recurrencia],['¿Afectó a pacientes?',i.afecta],['Gravedad',i.gravedad],['Urgencia',i.urgencia],['SLA esperado',i.sla],['Qué necesita del corporativo',i.necesita],['Asignado a',i.asignadoA],['Estado',i.estado]].map(([k,v]) => `<tr><th style="width:40%">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}
      </tbody></table>
      <h4 style="margin-top:1rem">Relato del incidente</h4><p>${esc(i.relato)}</p></div>
    <div class="card"><h3>Respuesta al Gerente</h3>
      <textarea data-borrador="inc.resp.${esc(i.codigo)}" placeholder="Respuesta del área asignada">${esc(i.respuesta)}</textarea>
      <div class="row" style="margin-top:.8rem"><button class="btn" id="btnResolverInc" data-codigo="${esc(i.codigo)}" ${i.estado==='Resuelto'?'disabled':''}>Marcar como resuelto</button><a class="btn ghost" href="#/gcl/incidencias">Volver</a></div></div></div>`;
}
function enlazarGCL([tabPedida]){
  const tab = tabGCL(tabPedida || 'autogestion');
  if (tab !== 'incidencias') return;
  document.getElementById('btnIncSinEnlace')?.addEventListener('click', () => alert('Maqueta: aquí se abrirá el formulario de Google vigente del Reporte Gerencial de Incidentes. Falta configurar su enlace.'));
  document.querySelectorAll('#tablaInc tr[data-ir]').forEach(tr => tr.addEventListener('click', () => navegar(tr.dataset.ir)));
  const filtrar = () => {

  filtrar();

    const inc = S.incidencias.find(x => x.codigo === btn.dataset.codigo);
    inc.respuesta = S.borradores['inc.resp.' + inc.codigo] ?? inc.respuesta;

  });
}

function vistaEvidencia(){

function enlazarDocumental(){
  const filtrar = (inputId, tablaId, vacioId) => {
    const input = document.getElementById(inputId); if (!input) return;
    const aplicar = () => { const q = normalizar(input.value); let n = 0; document.querySelectorAll(`#${tablaId} tbody tr`).forEach(tr => { const ok = !q || tr.dataset.texto.includes(q); tr.style.display = ok ? '' : 'none'; if (ok) n++; }); if (vacioId) document.getElementById(vacioId).style.display = n ? 'none' : ''; };
    input.addEventListener('input', aplicar); aplicar();
  };
  filtrar('buscarDoc', 'tablaDocs');
  filtrar('buscarEvidencia', 'tablaEvidencia', 'evidenciaVacia');
  document.getElementById('btnQuiz')?.addEventListener('click', () => alert('Maqueta: aquí se abrirá el quiz de esta cápsula en Google Classroom.'));
}

function ticketsFiltrados(){
  const f = S.filtrosPaciente;
  return S.tickets.filter(t => enVista(t.sucursal) || (sucursalVista() === 'RED' && t.sucursal === CODIGO_SIN_REGISTRO))
    .filter(t => (!f.tipo || t.tipo === f.tipo) && (!f.estado || t.estado === f.estado) && (!f.medio || t.medio === f.medio)
      && (!f.desde || t.fechaIngreso >= f.desde) && (!f.hasta || t.fechaIngreso <= f.hasta)
      && (sucursalVista() !== 'RED' || !f.sucursal || t.sucursal === f.sucursal))
    .sort((a,b) => b.fechaIngreso.localeCompare(a.fechaIngreso));

function badgeExterno(t){

  const clase = t.externo.estado !== 'En curso' ? 'b-neutral' : dias < 0 ? 'b-danger' : dias <= 3 ? 'b-warn' : 'b-info';
  return ` <span class="badge ${clase}" title="Plazo fijado por el organismo">${esc(t.externo.organismo)}${t.externo.estado === 'En curso' ? ` · ${dias < 0 ? 'vencido' : dias + ' días'}` : ''}</span>`;
